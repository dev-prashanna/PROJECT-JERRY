[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Wireless upload — no IO0/RST dance needed after the first flash:
;   pio run -e esp32cam_ota -t upload
; Requires: sudo ufw allow 54321/tcp   (device connects back to us)
[env:esp32cam_ota]
extends = env:esp32cam
upload_protocol = espota
upload_port = 192.168.1.79
upload_flags =
    --auth=prakashcam
    --timeout=30
    --host_port=54321
